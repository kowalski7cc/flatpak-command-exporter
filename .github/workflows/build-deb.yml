name: Build and publish Debian packages

on:
  release:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container:
      image: node:24-trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            debhelper \
            dh-python \
            dpkg-dev \
            make \
            pybuild-plugin-pyproject \
            python3 \
            python3-gi \
            gir1.2-flatpak-1.0 \
            python3-setuptools

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build Debian packages
        run: DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b

      - name: Upload packages to Gitea registry
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
        run: |
          : "${REGISTRY_TOKEN:?Set the REGISTRY_TOKEN repository or organization secret}"
          for release in trixie forky; do
            for package in ../flatpak-command-exporter_*.deb ../flatpak-command-exporter-gui_*.deb; do
              [ -f "$package" ] || {
                echo "No Debian package found at $package" >&2
                exit 1
              }
              curl --fail --show-error --silent \
                -u "${REGISTRY_OWNER}:${REGISTRY_TOKEN}" \
                -T "$package" \
                "${GITEA_SERVER_URL}/api/packages/${REGISTRY_OWNER}/debian/pool/${release}/main/upload"
            done
          done
