[project]
name = "flatpak-command-exporter"
authors = [{name = "Kowalski Dragon (kowalski7cc)"}]
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    'importlib-metadata; python_version<"3.10"',
]

[project.optional-dependencies]
dev = [
    "PyGObject"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
flatpak-command-exporter = "flatpak_command_exporter.__main__:main"
