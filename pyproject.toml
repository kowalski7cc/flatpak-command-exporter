[project]
name = "flatpak-command-exporter"
authors = [{name = "Kowalski Dragon (kowalski7cc)"}]
version = "0.7.0"
requires-python = ">=3.13"
dependencies = [
    'importlib-metadata; python_version<"3.10"',
    "PyGObject",
]

[project.optional-dependencies]
# GTK 4 and libadwaita (including their introspection data) are OS dependencies.
gui = [
    "PyGObject"
]
dev = [
    "PyGObject"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["resources/xyz.kowalski7cc.flatpak-command-exporter.desktop"]
"share/icons/hicolor/scalable/apps" = ["resources/xyz.kowalski7cc.flatpak-command-exporter.svg"]
"share/icons/hicolor/symbolic/apps" = ["resources/xyz.kowalski7cc.flatpak-command-exporter-symbolic.svg"]

[tool.setuptools.package-data]
flatpak_command_exporter = ["flatpak-exported-commands.sh"]

[project.scripts]
flatshell = "flatpak_command_exporter.__main__:main"
flatpak-command-exporter = "flatpak_command_exporter.__main__:main"
Flatlink = "flatpak_command_exporter.gui:main"
flatpak-command-exporter-gui = "flatpak_command_exporter.gui:main"
